name: My Video Bot

on:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов
  workflow_dispatch:      # Ручной запуск

concurrency:
  group: bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 5ч 55мин

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем ffmpeg (нужен для склейки видео)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Устанавливаем зависимости
        run: pip install -r requirements.txt

      - name: Ищем рабочий прокси (чтобы качать с VK и др.)
        id: proxy
        uses: maximilianfeix/proxy-scraper@v1
        with:
          types: socks5
          https: true
          min-uptime: 90

      - name: Запускаем бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOCKS5_PROXY: ${{ steps.proxy.outputs.proxy }}
        run: python bot.py