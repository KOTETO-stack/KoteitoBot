name: My Video Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Устанавливаем зависимости
        run: pip install -r requirements.txt

      - name: Запускаем сервер PO Token (обход блокировки YouTube)
        run: |
          docker run -d --name bgutil-provider --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          echo "Ждем запуска сервера токенов..."
          sleep 7

      - name: Ищем рабочий прокси (для VK и др.)
        id: proxy
        uses: maximilianfeix/proxy-scraper@v1
        with:
          types: socks5
          https: true
          min-uptime: 90

      - name: Запускаем бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOCKS5_PROXY: ${{ steps.proxy.outputs.proxy }}
        run: python bot.py