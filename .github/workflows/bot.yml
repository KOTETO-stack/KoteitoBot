name: My Video Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем Deno (движок JS для решения задач YouTube)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Устанавливаем зависимости
        run: |
          pip install -U pip
          pip install -U -r requirements.txt

      # ЗАПУСК ГЕНЕРАТОРА ТОКЕНОВ (ОБХОД БЛОКИРОВКИ YOUTUBE)
      - name: Запускаем сервер PO Token
        run: |
          docker run -d --name bgutil-provider -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          echo "Ожидаем запуск сервера токенов..."
          sleep 10

      - name: Ищем рабочий прокси (для VK и др.)
        id: proxy
        uses: maximilianfeix/proxy-scraper@v1
        with:
          types: socks5
          https: true
          min-uptime: 90

      - name: Запускаем бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOCKS5_PROXY: ${{ steps.proxy.outputs.proxy }}
        run: python bot.py